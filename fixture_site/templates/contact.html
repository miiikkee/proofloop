<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Contact - Acme Studio</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:48px auto;padding:0 16px}label{display:block;margin-top:12px}input,textarea{width:100%;padding:8px}button{margin-top:16px;padding:10px 16px;background:#1f6feb;color:#fff;border:0;border-radius:6px}</style>
</head>
<body>
  <h1>Contact us</h1>
  <form id="contact-form" method="post" action="/contact">
    <label for="name">Name</label>
    <input id="name" name="name" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="4" required></textarea>
    <button id="send" type="button">Send message</button>
  </form>
</body>
</html>
